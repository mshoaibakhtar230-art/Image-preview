<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imgur: The magic of the Internet</title>

  <!-- Open Graph Meta Tags (Creates the social media preview card) -->
  <meta property="og:title" content="Imgur Image" />
  <meta property="og:description" content="From imgur.com" />
  <meta property="og:type" content="website" />
  <!-- Replace the link below with your actual blurred preview image URL -->
  <meta property="og:image" content="//imgur.com/a/yjVgk1B.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- JavaScript Redirect -->
  <script>
    // Replace the URL below with your Monetag Direct/Smartlink URL
    window.location.href = "https://julianovideo111.blogspot.com";
  </script>
</head>
<body>
  <p>Redirecting to image...</p>
</body>
</html>
